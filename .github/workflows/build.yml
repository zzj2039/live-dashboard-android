name: Build Android App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Keystore
        run: |
          echo "keystore.jks" > keystore.properties
          echo "storePassword=android" >> keystore.properties
          echo "keyAlias=androidkey" >> keystore.properties
          echo "keyPassword=android" >> keystore.properties
          echo "storeFile=keystore.jks" >> keystore.properties

      - name: Build Release APK with Signing
        run: ./gradlew assembleRelease --stacktrace -Pandroid.injected.signing.storeFile=keystore.jks -Pandroid.injected.signing.storePassword=android -Pandroid.injected.signing.keyAlias=androidkey -Pandroid.injected.signing.keyPassword=android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
